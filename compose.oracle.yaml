# Complete single-VM deployment: application + PostgreSQL + HTTPS.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisborder
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env.oracle first}
    volumes: [oracle_postgres:/var/lib/postgresql/data]
    networks: [oracle_backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegis -d aegisborder"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:${DB_PASSWORD}@db:5432/aegisborder
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env.oracle first}
      AUDIT_KEY: ${AUDIT_KEY:?Create .env.oracle first}
      PUBLIC_ORIGIN: https://${AEGIS_DOMAIN:?Set AEGIS_DOMAIN}
      PUBLIC_DEMO_MODE: "true"
      TRUSTED_PROXY_CIDRS: 10.88.7.10/32
    networks: [oracle_backend]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      AEGIS_DOMAIN: ${AEGIS_DOMAIN:?Set AEGIS_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - oracle_caddy_data:/data
      - oracle_caddy_config:/config
    networks:
      oracle_backend: {ipv4_address: 10.88.7.10}
    depends_on:
      app: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  oracle_backend:
    ipam:
      config: [{subnet: 10.88.7.0/24}]
volumes:
  oracle_postgres:
  oracle_caddy_data:
  oracle_caddy_config:
