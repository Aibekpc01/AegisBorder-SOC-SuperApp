# Separate project, database and credentials for public visitors.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisborder
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env.public-demo}
    volumes: [public_postgres:/var/lib/postgresql/data]
    networks: [public_demo]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegis -d aegisborder"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: aegisborder_soc_v02-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:${DB_PASSWORD}@db:5432/aegisborder
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env.public-demo}
      AUDIT_KEY: ${AUDIT_KEY:?Create .env.public-demo}
      PUBLIC_DEMO_MODE: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_PROXY_CIDRS: 10.88.6.0/24
    ports: ["127.0.0.1:8001:8000"]
    networks: [public_demo]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  tunnel:
    image: cloudflare/cloudflared:latest@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --url, "http://app:8000", --protocol, http2]
    networks: [public_demo]
    depends_on:
      app: {condition: service_healthy}
networks:
  public_demo:
    ipam:
      config: [{subnet: 10.88.6.0/24}]
volumes:
  public_postgres:
