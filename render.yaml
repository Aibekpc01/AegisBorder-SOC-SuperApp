# Render Blueprint: isolated public demonstration, Free plans only.
services:
  - type: web
    name: aegisborder
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegisborder-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: AUDIT_KEY
        generateValue: true
      - key: PUBLIC_DEMO_MODE
        value: "true"
databases:
  - name: aegisborder-db
    plan: free
    region: frankfurt
    databaseName: aegisborder
    user: aegis
    ipAllowList: []
